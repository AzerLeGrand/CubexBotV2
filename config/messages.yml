# Tous les textes destinés aux utilisateurs.
#
# Aucun réglage technique ici — ils vivent dans config.yml.
#
# Les variables sont entre accolades simples et nommées en anglais, comme les
# clés de configuration : {username}, {count}, {errors}. Une variable non
# fournie à l'exécution produit une erreur journalisée, jamais un affichage vide.

commands:
  reload:
    # Visible par tous les membres dans l'interface de Discord.
    description: "Recharge les fichiers de configuration sans redémarrer le bot."
  unblock:
    description: "Lève le blocage de vérification d'un membre et remet son compteur à zéro."
    option_member: "Le membre à débloquer."
  denied:
    title: "Accès refusé"
    description: "Cette commande est réservée à l'équipe."
  failed:
    title: "Commande interrompue"
    description: >-
      Une erreur est survenue pendant le traitement. L'équipe technique a été
      prévenue.
  unavailable:
    title: "Fonctionnalité indisponible"
    description: >-
      Cette commande dépend d'un salon ou d'un rôle que le bot n'a pas trouvé au
      démarrage. Un membre de l'équipe technique a été prévenu.

verification:
  welcome:
    title: "Bienvenue sur Cubex"
    description: >-
      L'accès au serveur demande une courte vérification, destinée à écarter les
      comptes automatisés. Cliquez sur « Se vérifier » : une image contenant un
      code s'affichera, visible de vous seul.
  buttons:
    # Libellés des deux boutons du message d'accueil. Courts : Discord les
    # affiche sur une seule ligne.
    start: "Se vérifier"
    enter_code: "Entrer le code"
  challenge:
    title: "Recopiez le code"
    description: >-
      Le code figure sur l'image ci-dessous. Cliquez sur « Entrer le code » pour
      le saisir. La casse et les espaces n'ont pas d'importance. Le code reste
      valable {minutes} minutes ; passé ce délai, vous pourrez en demander un
      nouveau.
  modal:
    title: "Vérification"
    field_label: "Code affiché sur l'image"
    placeholder: "Les caractères, dans l'ordre"
  success:
    title: "Vérification réussie"
    description: >-
      Votre accès au serveur est ouvert. Bonne visite, et bon jeu sur
      fr.cubex.club.
  expired:
    title: "Code expiré"
    description: >-
      Ce code n'est plus valable. Cliquez de nouveau sur « Se vérifier » pour en
      obtenir un autre. Cette tentative n'a pas été décomptée.
  wrong_code:
    title: "Code incorrect"
    # Le ton compte : la plupart des échecs viennent d'une image mal lue, pas
    # d'une fraude. Le texte ne suppose rien de l'intention du membre.
    description: >-
      Le code saisi ne correspond pas à celui de l'image. Il vous reste
      {remaining} tentative(s). Vous pouvez demander une nouvelle image si
      celle-ci est difficile à lire.
  blocked:
    title: "Vérification bloquée"
    description: >-
      Le nombre de tentatives autorisées est atteint et votre vérification est
      bloquée. Contactez un membre de l'équipe : le déblocage est immédiat et ne
      demande aucune justification.
  already_verified:
    title: "Vous êtes déjà vérifié"
    description: "Votre accès au serveur est ouvert, il n'y a rien à faire."
  role_failed:
    title: "Vérification impossible pour le moment"
    # N'accuse ni le membre ni ne promet de délai : le bot ne sait pas quand
    # quelqu'un corrigera la configuration du serveur.
    description: >-
      Votre code était correct, mais le rôle d'accès n'a pas pu vous être
      attribué. L'équipe technique vient d'être prévenue. Réessayez dans un
      moment, ou contactez l'équipe si le problème persiste.
  # Réponses au modérateur qui débloque. Trois issues distinctes : « rien à
  # faire » lui dit qu'il s'est trompé de personne, là où un « c'est fait »
  # indifférencié le laisserait croire qu'il a réglé un problème existant
  # ailleurs.
  unblock:
    unblocked:
      title: "Membre débloqué"
      description: >-
        {member} peut de nouveau se vérifier. Son compteur de tentatives est
        remis à zéro.
    counter_reset:
      title: "Compteur remis à zéro"
      description: >-
        {member} n'était pas bloqué, mais avait des tentatives en cours. Son
        compteur est remis à zéro.
    nothing_to_do:
      title: "Rien à faire"
      description: >-
        {member} n'a ni tentative en cours ni blocage. Si un membre vous a
        signalé un problème d'accès, il vient d'ailleurs.

  log:
    # Salon d'arrivées, lu par les modérateurs. Aucune mention : un salon qui
    # notifie à chaque entrée devient inutilisable dès la première vague.
    success:
      title: "Vérification réussie"
      description: "{member} a résolu la vérification et reçu son accès."
  alerts:
    # Le rôle mentionné n'apparaît PAS dans ces descriptions : une mention
    # placée dans un embed s'affiche sans notifier personne. Elle part dans le
    # contenu du message, où elle prévient réellement.
    exhausted:
      title: "Tentatives de vérification épuisées"
      description: >-
        Le membre {member} a épuisé ses tentatives de vérification et se trouve
        bloqué. Il peut s'agir d'un compte automatisé comme d'un membre en
        difficulté de lecture.
    role_failure:
      title: "Attribution du rôle impossible"
      description: >-
        Le rôle de vérification n'a pas pu être attribué à {member}. Vérifiez
        que le rôle du bot est placé au-dessus du rôle attribué dans la
        hiérarchie, que la permission de gestion des rôles est accordée, et que
        le rôle configuré existe toujours. Aucun membre ne peut entrer sur le
        serveur tant que cette panne dure.

components:
  expired:
    title: "Action expirée"
    # Ne promet rien que le bot puisse démentir : il ne sait pas si un message
    # plus récent existe, seulement que celui-ci ne route plus.
    description: >-
      Ce bouton provient d'un message publié avant une mise à jour du bot et ne
      répond plus. Utilisez le message le plus récent du salon, ou prévenez
      l'équipe s'il n'y en a pas.

config:
  reloaded:
    title: "Configuration rechargée"
    description: "Les trois fichiers ont été relus et validés."
  reload_failed:
    title: "Rechargement refusé"
    # {count} et {errors} sont fournis par la commande. La configuration en
    # place n'est pas remplacée tant que la nouvelle n'est pas valide.
    description: |-
      La configuration en place reste active, le bot continue de tourner.

      {count} anomalie(s) relevée(s) :
      {errors}
    # Ajouté à la description quand la liste ne tient pas dans un embed. La
    # troncature est faite avant substitution, le compte total reste exact.
    truncated: "{shown} anomalies affichées sur {count}. Le détail complet est dans les journaux."

# Journalisation des événements Discord (phase 2).
#
# Les gabarits d'embeds.yml ne portent qu'un titre et une description : toute la
# mise en page vit donc ici, et se réordonne sans toucher au code.
#
# Chaque description de famille reçoit TOUJOURS les sept variables ci-dessous —
# un marqueur resté visible signalerait une variable oubliée.
#   {type}     libellé du type d'événement
#   {time}     heure, dans le fuseau du serveur
#   {target}   membre concerné
#   {actor}    auteur de l'action, avec sa réserve éventuelle
#   {channel}  salon concerné
#   {content}  contenu du message, ou renvoi vers la pièce jointe
#   {data}     détail propre au type — voir la section logs.data. Seule variable
#              qui puisse être VIDE, quand l'événement n'a rien de plus à dire :
#              sa ligne disparaît alors, plutôt que d'afficher un tiret.
logs:
  family:
    messages: "Journal des messages"
    voice: "Journal vocal"
    members: "Journal des membres"
    server: "Journal du serveur"
    moderation: "Journal de modération"

  rich:
    messages: |-
      **{type}** · {time}
      Auteur du message : {target}
      Salon : {channel}
      Action de : {actor}

      {content}
    voice: |-
      **{type}** · {time}
      Membre : {target}
      Salon : {channel}
      Action de : {actor}
    # La dernière ligne porte le détail propre au type — voir logs.data
    # ci-dessous. Elle disparaît d'elle-même quand l'événement n'a rien de
    # particulier à dire.
    members: |-
      **{type}** · {time}
      Membre : {target}
      Action de : {actor}
      {data}
    server: |-
      **{type}** · {time}
      Élément concerné : {target}
      Salon : {channel}
      Action de : {actor}
    moderation: |-
      **{type}** · {time}
      Membre : {target}
      Action de : {actor}
      {data}

  # Détail propre à chaque type, rendu en dernière ligne des familles qui
  # portent un {data}. Le code ne compose que la clé — logs.data.<event_type> —
  # et fournit les valeurs que l'écouteur a écrites : toute la formulation est
  # ici, et se réécrit sans toucher au code.
  #
  # Deux conventions à connaître pour éditer ces lignes :
  #
  #   - Les variables d'horodatage — celles dont le nom finit par _at, et
  #     « until » — sont rendues en marquage natif Discord. Chaque lecteur les
  #     voit dans SON fuseau, avec la date complète, là où {time} ne porte que
  #     l'heure du serveur.
  #   - Une valeur absente rend le tiret de logs.value.none, jamais un blanc.
  #
  # Un type dont l'écouteur ne remplit pas data n'a pas de clé ici et n'affiche
  # aucune ligne de détail — un bannissement ordinaire, par exemple.
  data:
    # La date de création du COMPTE, pas celle de l'arrivée : un compte créé le
    # matin même qui rejoint l'après-midi est le signal que ce salon existe pour
    # donner.
    member_join: "Compte créé le {created_at}"
    member_leave: "Sur le serveur depuis le {joined_at}"
    # Même détail que le départ : l'expulsion est le même signal de passerelle,
    # promu par la corrélation.
    member_kick: "Sur le serveur depuis le {joined_at}"
    member_nickname: "Pseudo : {nickname_before} → {nickname_after}"
    member_role_add: "Rôle : <@&{role_id}>"
    member_role_remove: "Rôle : <@&{role_id}>"
    # Un seul type pour deux gestes opposés (spec §2), donc deux libellés. La
    # variante écrite dans data choisit lequel.
    member_timeout:
      set: "Exclusion jusqu'au {until}"
      lifted: "Exclusion levée"
    # Raison saisie par le modérateur, reprise du journal d'audit. Ligne à
    # part, et non un champ de chaque gabarit ci-dessus : elle ne vient pas de
    # l'écouteur mais de la corrélation, et peut donc accompagner n'importe
    # quel type corrélé — bannissement, expulsion, retrait de rôle, exclusion
    # temporaire. Elle n'apparaît que lorsqu'elle existe, ce qui est rare : peu
    # de modérateurs en saisissent une.
    reason: "Raison : {reason}"
    # {keyword} est le mot CONFIGURÉ DANS LA RÈGLE, jamais l'extrait du message
    # du membre : celui-ci relève du contenu, qui a sa propre rétention.
    automod_action: |-
      Règle : `{rule_id}` ({trigger})
      Action : {action} · mot déclencheur : {keyword}

  compact:
    title: "Résumé d'activité"
    body: "{lines}"
    # Une ligne par événement. Aucun contenu de message : il part en pièce
    # jointe, jamais dans une énumération qu'on parcourt en diagonale.
    line: "`{time}` **{type}** — {target} · {actor}"

  # Formulation imposée par la spec §3. La corrélation avec le journal d'audit
  # se fait sur le salon, la cible et une fenêtre temporelle : elle est faillible
  # dès que deux actions semblables tombent dans la même seconde. Ne JAMAIS
  # affirmer un auteur probable.
  actor:
    # La plateforme désigne l'auteur elle-même : aucune réserve à formuler.
    certain: "{user}"
    # La réserve est portée par le texte, pas par une nuance de couleur qu'on
    # oublierait de lire.
    probable: "{user} (probable)"
    # Personne n'est nommé. Discord n'inscrit rien au journal d'audit quand un
    # membre supprime son propre message : c'est le cas le plus fréquent.
    unknown: "auteur inconnu"

  content:
    before: "**Avant**\n{text}"
    after: "**Après**\n{text}"
    # Au-delà de logs.attachment_threshold caractères : l'embed porte le
    # contexte, le fichier porte le contenu intégral. Jamais de troncature — la
    # fin d'un message supprimé est souvent ce qu'on cherchait.
    attached: "Contenu joint en fichier : `{file}`"

  attachment:
    # Une entrée par événement dans le fichier joint d'un lot condensé.
    entry: "[{time}] {type} — {author}\n{content}\n"

  # Valeur absente : un tiret plutôt qu'un blanc, qui passerait pour un oubli.
  value:
    none: "—"

  # Libellés des trente-trois types. Le code n'écrit aucun de ces textes : il
  # compose la clé logs.type.<event_type>.
  type:
    message_delete: "Message supprimé"
    message_edit: "Message modifié"
    message_bulk_delete: "Suppression en masse"
    voice_join: "Connexion en vocal"
    voice_leave: "Déconnexion du vocal"
    voice_move: "Changement de salon vocal"
    voice_server_mute: "Micro coupé par le serveur"
    voice_server_deafen: "Casque coupé par le serveur"
    voice_suppress: "Mise en attente"
    member_join: "Arrivée sur le serveur"
    member_leave: "Départ du serveur"
    member_nickname: "Changement de pseudo"
    member_role_add: "Rôle attribué"
    member_role_remove: "Rôle retiré"
    role_create: "Rôle créé"
    role_delete: "Rôle supprimé"
    role_update: "Rôle modifié"
    channel_create: "Salon créé"
    channel_delete: "Salon supprimé"
    channel_update: "Salon modifié"
    channel_permissions_update: "Permissions de salon modifiées"
    webhook_update: "Webhooks modifiés"
    emoji_create: "Émoji ajouté"
    emoji_delete: "Émoji supprimé"
    emoji_update: "Émoji renommé"
    invite_create: "Invitation créée"
    invite_delete: "Invitation supprimée"
    guild_update: "Paramètres du serveur modifiés"
    member_ban: "Bannissement"
    member_unban: "Levée de bannissement"
    member_kick: "Expulsion"
    member_timeout: "Exclusion temporaire"
    automod_action: "Règle AutoMod déclenchée"
