# Réglages techniques : identifiants, seuils, délais, bascules.
#
# Aucun texte destiné à un utilisateur ici — ils vivent dans messages.yml.
# Aucun secret ici — ils vivent dans .env.
#
# TOUT IDENTIFIANT DISCORD EST ENTRE GUILLEMETS. Un identifiant fait 17 à 20
# chiffres ; écrit sans guillemets, il est lu comme un nombre et ses derniers
# chiffres sont tronqués silencieusement. C'est la panne qui a arrêté la version
# précédente du bot.
#
# Les identifiants ci-dessous sont des valeurs de substitution. Le bot démarre
# avec, mais signale à la connexion que les références sont introuvables et
# désactive les fonctionnalités concernées.

bot:
  # Serveur Cubex. Le bot n'opère que sur celui-ci.
  guild_id: "1370784866706264124"
  # Fuseau de référence pour tout le bot : rotation des journaux et purge
  # nocturne tombent sur la même journée civile.
  timezone: "Europe/Paris"

# Permissions par commande. Une liste vide est refusée : pour ouvrir une
# commande à tous, écrire le littéral "public".
commands:
  reload:
    allowed_roles:
      - "1380366331517603890" # Owner
      - "1375088655378677872" # Admin
  # Liste distincte de celle de reload, délibérément : recharger la
  # configuration est une action d'exploitation, débloquer un membre une action
  # de modération courante. Les deux n'ont aucune raison de partager la même
  # liste.
  unblock:
    allowed_roles:
      - "1380366331517603890" # Owner
      - "1375088655378677872" # Admin
      - "1386479654914887720" # S-Modo
      - "1380366470730616966" # Modo
      - "1456439317865169092" # Modo-T

database:
  # Chemin relatif à la racine du projet. Le dossier est exclu de Git.
  file: "data/cubex.sqlite"
  # Attente sur une base verrouillée — par un sqlite3 lancé en SSH, par exemple.
  # À relever si le disque est lent.
  busy_timeout_ms: 5000

logging:
  # error | warn | info | debug
  level: "info"
  directory: "logs"
  # Les fichiers sont nommés <prefix>-AAAA-MM-JJ.log.
  file_prefix: "cubex"
  # Durée de conservation des journaux sur disque. Appliquée par le transport
  # lui-même, pas par le registre de purge — voir .claude/rules/database.md.
  retention_days: 30

purge:
  # Exécution quotidienne, au creux de fréquentation.
  hour: 4

minecraft:
  # Le pont vers le serveur Minecraft est reporté hors v1. Les commandes qui en
  # dépendent répondent que la fonctionnalité n'est pas active.
  enabled: false

# Contrôle d'accès à l'entrée du serveur (phase 1). Section validée par le
# fragment de schéma du module, au même titre que les sections du noyau.
verification:
  # Seul salon accessible à un membre non vérifié. Introuvable, le module
  # entier se désactive : sans salon, il n'y a pas de porte d'entrée.
  channel_id: "1503043771015762143"
  # Rôle attribué après une vérification réussie. Le rôle du bot doit être
  # au-dessus de celui-ci dans la hiérarchie, sinon l'attribution échoue.
  member_role_id: "1381766005604352130"

  challenge:
    # image uniquement : l'épreuve web est prévue par la spec mais pas écrite.
    type: image
    code_length: 6
    # Cinq minutes. Plafonne à elle seule le rythme de génération : un reclic
    # pendant la validité rend le même code et la même image.
    ttl_seconds: 300
    # Sans 0, O, 1, I ni l : des membres échouent en ayant lu correctement.
    alphabet: "ABCDEFGHJKMNPQRSTUVWXYZ23456789"
    input:
      # Un membre qui lit bien l'image ne doit pas échouer sur une majuscule ou
      # sur un espace collé par un correcteur automatique.
      case_sensitive: false
      strip_whitespace: true
    image:
      width: 320
      height: 110
      # Versionnée dans le dépôt : aucune police n'est garantie présente sur
      # une Debian minimale. Voir assets/fonts/README.md.
      font_path: "assets/fonts/DejaVuSans-Bold.ttf"
      font_size: 52
      background: "#FFFFFF"
      text_color: "#1A1A1A"
      noise_lines: 6
      noise_dots: 220
      distortion: 0.35

  # Coupe l'automatisation et signale un membre en difficulté ; ce n'est pas une
  # résistance au force brute, que la taille du code assure déjà.
  max_attempts: 5

  alert:
    # Salon commun aux deux alertes. Introuvable, les deux se taisent et la
    # vérification continue.
    channel_id: "1537574082890174648"
    # Mentionné à l'épuisement des tentatives, jamais à chaque échec.
    exhausted_role_id: "1503034271546343544"
    # Mentionné quand l'attribution du rôle échoue : c'est une panne de
    # configuration du serveur, elle doit remonter à qui peut la corriger.
    failure_role_id: "1537574425229004841"

  log:
    # Vérifications réussies. Clé propre au module plutôt qu'un renvoi vers la
    # section logs de la phase 2, qui n'existe pas encore.
    channel_id: "1537840906936258642"

  retention:
    # Historique des tentatives et des vérifications. L'état des membres et les
    # blocages ne sont jamais purgés : un blocage qui se lèverait tout seul
    # viderait le mécanisme de son sens.
    history_days: 90

# Journalisation des événements Discord (phase 2). Section validée par le
# fragment de schéma du module, au même titre que les sections du noyau.
logs:
  # Salons de restitution. Un salon introuvable ne désactive que sa capacité :
  # l'écriture en base continue, c'est la garantie centrale de la spec §5.
  channels:
    messages: "1503355248155038008"
    voice: "1518337435434618981"
    members: "1370784866706264127"
    server: "1518337786166640883"
    moderation: "1503355380040732672"

  # Chaque événement s'active individuellement et pointe individuellement vers
  # un salon : le regroupement ci-dessous n'est qu'une valeur de départ, chaque
  # ligne se déplace sans toucher au code. Le nom de la clé « channel » doit
  # être une clé de logs.channels ci-dessus, la validation le vérifie.
  events:
    # -- Messages --------------------------------------------------------
    message_delete:
      enabled: true
      channel: messages
    message_edit:
      enabled: true
      channel: messages
    message_bulk_delete:
      enabled: true
      channel: messages

    # -- Vocal -----------------------------------------------------------
    voice_join:
      enabled: true
      channel: voice
    voice_leave:
      enabled: true
      channel: voice
    voice_move:
      enabled: true
      channel: voice
    voice_server_mute:
      enabled: true
      channel: voice
    voice_server_deafen:
      enabled: true
      channel: voice
    voice_suppress:
      enabled: true
      channel: voice

    # -- Membres ---------------------------------------------------------
    member_join:
      enabled: true
      channel: members
    member_leave:
      enabled: true
      channel: members
    member_nickname:
      enabled: true
      channel: members
    member_role_add:
      enabled: true
      channel: members
    member_role_remove:
      enabled: true
      channel: members

    # -- Serveur ---------------------------------------------------------
    role_create:
      enabled: true
      channel: server
    role_delete:
      enabled: true
      channel: server
    role_update:
      enabled: true
      channel: server
    channel_create:
      enabled: true
      channel: server
    channel_delete:
      enabled: true
      channel: server
    channel_update:
      enabled: true
      channel: server
    channel_permissions_update:
      enabled: true
      channel: server
    # Événement unique : Discord n'émet ni création ni suppression distinctes
    # de webhook, seulement une mise à jour du salon concerné.
    webhook_update:
      enabled: true
      channel: server
    emoji_create:
      enabled: true
      channel: server
    emoji_delete:
      enabled: true
      channel: server
    emoji_update:
      enabled: true
      channel: server
    invite_create:
      enabled: true
      channel: server
    invite_delete:
      enabled: true
      channel: server
    guild_update:
      enabled: true
      channel: server

    # -- Modération ------------------------------------------------------
    member_ban:
      enabled: true
      channel: moderation
    member_unban:
      enabled: true
      channel: moderation
    member_kick:
      enabled: true
      channel: moderation
    # L'exclusion temporaire, posée ou levée. Une seule ligne : la spec la
    # listait aussi sous « Membres », c'était un doublon.
    member_timeout:
      enabled: true
      channel: moderation
    automod_action:
      enabled: true
      channel: moderation

  grouping:
    # Discord limite le débit d'envoi : une purge de cent messages saturerait un
    # envoi par événement. Un événement isolé part donc avec ce léger délai.
    window_seconds: 5
    # Nombre d'ÉVÉNEMENTS, pas une taille : au-delà, la fenêtre part en un seul
    # embed condensé plutôt qu'en un embed par événement.
    compact_threshold: 5

  # Au-delà de ce nombre de caractères, le contenu part en fichier joint plutôt
  # qu'en troncature : un embed rejeté par l'API est un message qui n'arrive
  # jamais, et tronquer perdrait la fin du message — souvent ce qu'on cherchait.
  attachment_threshold: 1024

  audit:
    # Écart maximal accepté ENTRE un événement et une entrée du journal
    # d'audit pour les lier. Trop large, elle attribue une action au mauvais
    # modérateur ; trop étroite, elle rend « auteur inconnu » sur des cas
    # identifiables. À ne pas confondre avec write_delay_ms ci-dessous.
    correlation_window_seconds: 5
    # Combien de temps on ATTEND avant d'écrire. Discord n'inscrit l'entrée
    # d'audit qu'après avoir émis l'événement de passerelle : écrire aussitôt,
    # ce serait écrire « auteur inconnu » sur des actions attribuables.
    write_delay_ms: 750
    # Âge au-delà duquel les entrées d'une action sont relues auprès de
    # l'API. Une purge de cent messages doit coûter une requête, pas cent.
    refresh_interval_ms: 2000
    # Nombre d'entrées demandées par requête ; au-delà de la fenêtre de
    # corrélation, elles sont écartées à la lecture.
    fetch_limit: 25

  catchup:
    # Un bot arrêté trois semaines ne doit pas déverser trois semaines
    # d'historique au redémarrage.
    max_hours: 24

  retention:
    # Le contenu des messages part avant les métadonnées : c'est toute la raison
    # de leur séparation en deux tables.
    message_content_days: 30
    # Métadonnées de tout événement, actions de modération comprises. Un
    # bannissement produit deux lignes : celle-ci, et une dans « sanctions » à
    # la phase 3, conservée sans limite et exclue de la purge.
    structural_days: 90

  # Comptes, salons et rôles dont l'activité ordinaire n'est pas journalisée.
  # Le bot n'a pas à y figurer : il s'exclut lui-même par client.user.id, à
  # l'exécution. Une garantie structurelle ne doit pas dépendre d'une valeur
  # éditable, qu'un vidage de liste ou une recréation de l'application
  # suffirait à lever en silence.
  exclusions:
    channels: []
    users: []
    roles: []
