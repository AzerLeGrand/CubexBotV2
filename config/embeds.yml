# Gabarits d'affichage. Aucune logique ici, aucun texte non plus : un gabarit ne
# porte que des renvois vers messages.yml et une couleur.

# Les quatre clés sont une interface publique : le module d'embeds de la phase 5
# les expose telles quelles au staff. Ne pas les renommer.
colors:
  # Extrait du logo Cubex.
  brand: "#F60321"
  success: "#57F287"
  # Orange volontaire : le rouge Discord standard (#ED4245) est trop proche du
  # rouge de marque pour être distingué d'un coup d'œil. Ne pas le « corriger ».
  error: "#E67E22"
  info: "#5865F2"

# Commun à tous les embeds.
footer:
  text: "Cubex"
  timestamp: true

templates:
  command_denied:
    color: "error"
    title_key: "commands.denied.title"
    description_key: "commands.denied.description"

  command_failed:
    color: "error"
    title_key: "commands.failed.title"
    description_key: "commands.failed.description"

  feature_unavailable:
    color: "error"
    title_key: "commands.unavailable.title"
    description_key: "commands.unavailable.description"

  # Bouton, menu ou modale dont l'identifiant ne route plus : message publié
  # avant un déploiement qui a retiré le composant. Sans réponse, le membre
  # verrait « L'application ne répond pas » et croirait le bot cassé.
  component_expired:
    color: "error"
    title_key: "components.expired.title"
    description_key: "components.expired.description"

  # --- Vérification (phase 1) ------------------------------------------------

  # Message permanent du salon de vérification : c'est la première chose que
  # voit un nouvel arrivant, d'où la couleur de marque.
  verification_welcome:
    color: "brand"
    title_key: "verification.welcome.title"
    description_key: "verification.welcome.description"

  verification_challenge:
    color: "info"
    title_key: "verification.challenge.title"
    description_key: "verification.challenge.description"

  verification_success:
    color: "success"
    title_key: "verification.success.title"
    description_key: "verification.success.description"

  # Un code expiré et un membre déjà vérifié ne sont pas des échecs : la couleur
  # d'information évite de faire passer une situation banale pour une faute.
  verification_expired:
    color: "info"
    title_key: "verification.expired.title"
    description_key: "verification.expired.description"

  verification_already_verified:
    color: "info"
    title_key: "verification.already_verified.title"
    description_key: "verification.already_verified.description"

  verification_wrong_code:
    color: "error"
    title_key: "verification.wrong_code.title"
    description_key: "verification.wrong_code.description"

  verification_blocked:
    color: "error"
    title_key: "verification.blocked.title"
    description_key: "verification.blocked.description"

  verification_role_failed:
    color: "error"
    title_key: "verification.role_failed.title"
    description_key: "verification.role_failed.description"

  # Déblocage : trois gabarits et non un seul paramétré. Un gabarit porte un
  # titre et une couleur FIXES — un gabarit unique donnerait les mêmes aux trois
  # cas, et le modérateur perdrait la distinction au coup d'œil.
  verification_unblocked:
    color: "success"
    title_key: "verification.unblock.unblocked.title"
    description_key: "verification.unblock.unblocked.description"

  verification_counter_reset:
    color: "success"
    title_key: "verification.unblock.counter_reset.title"
    description_key: "verification.unblock.counter_reset.description"

  # Information et non succès : rien ne s'est passé, et le modérateur s'est
  # probablement trompé de personne.
  verification_nothing_to_do:
    color: "info"
    title_key: "verification.unblock.nothing_to_do.title"
    description_key: "verification.unblock.nothing_to_do.description"

  # Journal des arrivées, lu par les modérateurs. Ce n'est pas une alerte : la
  # couleur informe, et le message ne mentionne personne.
  verification_log_success:
    color: "info"
    title_key: "verification.log.success.title"
    description_key: "verification.log.success.description"

  # Les deux alertes partent dans un salon staff, jamais vers le membre.
  verification_alert_exhausted:
    color: "error"
    title_key: "verification.alerts.exhausted.title"
    description_key: "verification.alerts.exhausted.description"

  verification_alert_role_failure:
    color: "error"
    title_key: "verification.alerts.role_failure.title"
    description_key: "verification.alerts.role_failure.description"

  # --- Configuration ---------------------------------------------------------

  config_reloaded:
    color: "success"
    title_key: "config.reloaded.title"
    description_key: "config.reloaded.description"

  config_reload_failed:
    color: "error"
    title_key: "config.reload_failed.title"
    description_key: "config.reload_failed.description"

  # --- Journalisation Discord (phase 2) --------------------------------------

  # UN GABARIT PAR FAMILLE, pas par type : trente-trois gabarits seraient
  # ingérables, et rien ne les distinguerait qu'un titre. Le type de l'événement
  # est un texte de messages.yml, inséré en variable.
  #
  # Un gabarit ne porte qu'une couleur, un titre et une description — le schéma
  # du socle n'accepte rien d'autre, pas de champs. La mise en page de chaque
  # famille vit donc dans messages.yml, où le staff peut la réordonner.
  log_messages:
    color: "info"
    title_key: "logs.family.messages"
    description_key: "logs.rich.messages"

  log_voice:
    color: "info"
    title_key: "logs.family.voice"
    description_key: "logs.rich.voice"

  # Les arrivées et départs ne sont pas des incidents : la couleur informe.
  log_members:
    color: "info"
    title_key: "logs.family.members"
    description_key: "logs.rich.members"

  # Couleur de marque : un changement de structure vient de l'équipe, pas d'un
  # membre, et se distingue ainsi du flux ordinaire au coup d'œil.
  log_server:
    color: "brand"
    title_key: "logs.family.server"
    description_key: "logs.rich.server"

  # Seule famille en erreur : une sanction doit sauter aux yeux dans un salon
  # que l'on parcourt en diagonale.
  log_moderation:
    color: "error"
    title_key: "logs.family.moderation"
    description_key: "logs.rich.moderation"

  # Rendu condensé, au-delà de logs.grouping.compact_threshold événements dans
  # une même fenêtre. Un embed unique qui énumère, plutôt que dix embeds qui
  # noient le salon.
  log_compact:
    color: "info"
    title_key: "logs.compact.title"
    description_key: "logs.compact.body"
